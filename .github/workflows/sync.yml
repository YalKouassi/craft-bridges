# Runs every bridge in apps/*.toml: one matrix job per app, every 3 hours and on demand.
#
# This repo is the shared release repo: every app's releases are published here, tagged
# <id>-v<version> (bridge.py's `shared = true`), and the launcher lists each app as
# YalKouassi/craft-bridges#<id>. This repo's own token is all it needs.
#
# Modes:
#   publish  mirror upstream's latest release if this repo doesn't have it yet.
#   compare  publish nothing: rebuild the app's last release here and check that the rebuilt
#            SHA256SUMS.txt matches the published one. For an app with no release yet, it
#            dry-runs upstream's latest.
# Scheduled runs use the HUB_MODE repository variable (compare when it isn't set).
name: sync

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: publish or compare
        type: choice
        options: [compare, publish]
        default: compare
      apps:
        description: App ids separated by spaces (empty = all of apps/)
        type: string
        default: ''
      tag:
        description: Upstream tag to mirror (only with one app; empty = latest release)
        type: string
        default: ''
      force:
        description: Rebuild and replace an existing release (publish mode)
        type: boolean
        default: false

permissions:
  contents: write   # publishing the releases into this repo
  issues: write     # the "Sync status" issue

concurrency:
  group: sync
  cancel-in-progress: false

env:
  MODE: ${{ inputs.mode || vars.HUB_MODE || 'compare' }}

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        env:
          WANTED: ${{ inputs.apps }}
          TAG: ${{ inputs.tag }}
        run: |
          all=$(ls apps/*.toml | sed 's#^apps/##; s#\.toml$##')
          if [ -n "$WANTED" ]; then
            for a in $WANTED; do
              printf '%s\n' "$all" | grep -qx -- "$a" || { echo "::error::no apps/$a.toml"; exit 1; }
            done
            all=$(printf '%s\n' $WANTED)
          fi
          if [ -n "$TAG" ] && [ "$(printf '%s\n' "$all" | wc -l)" -ne 1 ]; then
            echo "::error::a tag needs exactly one app"; exit 1
          fi
          echo "apps=$(printf '%s\n' "$all" | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  bridge:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJSON(needs.list.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The app's newest release here: the newest <id>-v… tag (the repo's own "latest" is
      # whichever app published last).
      - name: Read the config
        id: cfg
        env:
          APP: ${{ matrix.app }}
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=$(python -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["bridge"]["repo"])' "apps/$APP.toml")
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          before=$(gh api "repos/$repo/releases?per_page=100" --jq "[.[] | select(.draft | not) | select(.tag_name | startswith(\"$APP-v\"))][0].tag_name // empty" 2>/dev/null || true)
          echo "before=$before" >> "$GITHUB_OUTPUT"

      - name: Mirror
        id: mirror
        env:
          APP: ${{ matrix.app }}
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
          BEFORE: ${{ steps.cfg.outputs.before }}
          CRAFT_BRIDGE_HUB: ${{ github.repository }}
          CRAFT_BRIDGE_ERRORS: ${{ runner.temp }}/bridge-errors.txt
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--config "apps/$APP.toml" --out "$RUNNER_TEMP/dist")
          tag=$TAG
          if [ "$MODE" = compare ]; then
            args+=(--dry-run)
            # Rebuild what was published last: <id>-v1.2.3 came from upstream's v1.2.3 (or 1.2.3).
            if [ -z "$tag" ] && [ -n "$BEFORE" ]; then
              version=${BEFORE#"$APP-v"}
              tag="v$version"
              gh api "repos/$(python -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["bridge"]["upstream"])' "apps/$APP.toml")/releases/tags/$tag" --silent 2>/dev/null || tag=$version
            fi
          elif [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          python -I bridge.py "${args[@]}"

      - name: Compare with the published release
        id: compare
        if: env.MODE == 'compare' && steps.mirror.outcome == 'success' && steps.cfg.outputs.before != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.cfg.outputs.repo }}
          TAG: ${{ steps.cfg.outputs.before }}
        run: |
          built="$RUNNER_TEMP/dist/$TAG/SHA256SUMS.txt"
          gh release download "$TAG" --repo "$REPO" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/published"
          if diff <(sort "$RUNNER_TEMP/published/SHA256SUMS.txt" | tr -d '\r') <(sort "$built" | tr -d '\r') > "$RUNNER_TEMP/diff.txt"; then
            echo "same=yes" >> "$GITHUB_OUTPUT"
            echo "Identical to $REPO $TAG"
          else
            echo "same=no" >> "$GITHUB_OUTPUT"
            echo "::error title=${{ matrix.app }}::the rebuilt $TAG differs from the published one"
            cat "$RUNNER_TEMP/diff.txt"
            cp "$RUNNER_TEMP/diff.txt" "$RUNNER_TEMP/bridge-errors.txt"
            exit 1
          fi

      - name: Record the result
        if: always()
        env:
          APP: ${{ matrix.app }}
          REPO: ${{ steps.cfg.outputs.repo }}
          BEFORE: ${{ steps.cfg.outputs.before }}
          MIRROR: ${{ steps.mirror.outcome }}
          SAME: ${{ steps.compare.outputs.same }}
          GH_TOKEN: ${{ github.token }}
        run: |
          after=$(gh api "repos/$REPO/releases?per_page=100" --jq "[.[] | select(.draft | not) | select(.tag_name | startswith(\"$APP-v\"))][0].tag_name // empty" 2>/dev/null || true)
          if [ "$MIRROR" != success ]; then result="failed"
          elif [ "$MODE" = compare ] && [ "$SAME" = yes ]; then result="rebuilt $BEFORE: identical"
          elif [ "$MODE" = compare ] && [ "$SAME" = no ]; then result="rebuilt $BEFORE: DIFFERENT"
          elif [ "$MODE" = compare ]; then result="dry run of upstream's latest passed (no release yet)"
          elif [ -n "$after" ] && [ "$after" != "$BEFORE" ]; then result="mirrored a new release"
          else result="up to date"; fi
          mkdir -p "$RUNNER_TEMP/status"
          jq -n --arg app "$APP" --arg repo "$REPO" --arg tag "$after" --arg result "$result" \
            --rawfile errors <(head -c 2000 "$RUNNER_TEMP/bridge-errors.txt" 2>/dev/null || true) \
            '{app: $app, repo: $repo, tag: $tag, result: $result, errors: $errors}' > "$RUNNER_TEMP/status/$APP.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: status-${{ matrix.app }}
          path: ${{ runner.temp }}/status/${{ matrix.app }}.json
          retention-days: 7

  status:
    needs: bridge
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Pushes latest.json (below), so it keeps the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: status-*
          merge-multiple: true
          path: status

      # One "Sync status" issue in this repo replaces the per-bridge-repo issues.
      - name: Update the Sync status issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search 'Sync status in:title' --json number,title --jq 'map(select(.title == "Sync status"))[0].number // empty')
          # The issue keeps every app's last result in a hidden comment, so a run for a few apps
          # only replaces their rows.
          old='[]'
          if [ -n "$number" ]; then
            old=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r' | sed -n 's/^<!-- state: \([A-Za-z0-9+/=]*\) -->$/\1/p' | base64 -d 2>/dev/null) || old='[]'
            echo "$old" | jq -e 'type == "array"' >/dev/null 2>&1 || old='[]'
          fi
          state=$(jq -s --argjson old "$old" --arg now "$now" --arg mode "$MODE" --arg run "$RUN_URL" \
            --argjson apps "$(ls apps/*.toml | sed 's#^apps/##; s#\.toml$##' | jq -Rnc '[inputs]')" \
            'map(. + {checked: $now, mode: $mode, run: $run}) as $new
             | ($new | map(.app)) as $ids
             | ($old | map(select(.app as $a | ($ids | index($a) | not) and ($apps | index($a))))) + $new | sort_by(.app)' status/*.json)
          body="$RUNNER_TEMP/status.md"
          {
            echo "Every run updates this issue. Please open a new issue rather than commenting here."
            echo
            echo "Last run: $now, mode **$MODE** ([log]($RUN_URL))."
            echo
            echo "| App | Latest release | Last checked | Result |"
            echo "|---|---|---|---|"
            echo "$state" | jq -r '.[] | "| \(.app) | \(if .tag == "" then "none yet" else "[\(.tag)](https://github.com/\(.repo)/releases/tag/\(.tag))" end) | [\(.checked)](\(.run)) (\(.mode)) | \(.result) |"'
            if [ "$(echo "$state" | jq '[.[] | select(.errors != "")] | length')" -gt 0 ]; then
              echo
              echo "## What went wrong"
              echo "$state" | jq -r '.[] | select(.errors != "") | "\n### \(.app)\n\n~~~~text\n\(.errors | gsub("~~~~"; "~ ~ ~ ~"))\n~~~~"'
            fi
            echo
            echo "<!-- state: $(echo "$state" | jq -c . | base64 -w0) -->"
          } > "$body"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Sync status" --body-file "$body"
          fi

      # latest.json names each app's newest release here. The launcher reads it from
      # raw.githubusercontent.com when GitHub's API refuses it (60 requests an hour without a
      # token), so the apps stay listed. Committed only when a tag changes.
      - name: Update latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(ls apps/*.toml | sed 's#^apps/##; s#\.toml$##' | jq -Rnc '[inputs]')
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name' > "$RUNNER_TEMP/tags.txt"
          jq -Rn --argjson ids "$ids" '
            [inputs] as $tags
            | {schema: 1, apps: ($ids | map(. as $id | {key: $id, value: ([$tags[] | select(startswith($id + "-v"))][0])}) | map(select(.value != null)) | from_entries)}' < "$RUNNER_TEMP/tags.txt" > latest.json
          if git diff --quiet -- latest.json && git ls-files --error-unmatch latest.json >/dev/null 2>&1; then
            echo "latest.json unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "latest.json: $(jq -c .apps latest.json | head -c 200)"
          git push
