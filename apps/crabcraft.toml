# Unofficial bridge: mirrors RafaelMendes1407/CrabCraft releases for Craft Unofficial Launcher.
# Run by sync.yml with this repo's bridge.py (the README explains every key).

[bridge]
upstream = "RafaelMendes1407/CrabCraft"
repo = "YalKouassi/craft-bridges"
shared = true
upstream_sums = ["SHA256SUMS.txt"]
# Not mirrored: the setup .exe, which the launcher can't install.
skip = ['-setup\.exe$']

[descriptor]
id = "crabcraft"
name = "CrabCraft"
tagline = "Lightweight native IDE for Rust"
publisher = "Rafael Mendes"
bundle_id = "app.crabcraft"               # CFBundleIdentifier in upstream's scripts/bundle.sh
website = "https://github.com/RafaelMendes1407/CrabCraft"
color = "#ce422b"

[icon]
url = "https://raw.githubusercontent.com/{upstream}/{tag}/assets/icon.png"

# The zip holds CrabCraft/CrabCraft.exe, one wrapper folder the launcher accepts as it is. The exe
# has no version resource, so it installs from launcher 0.12 on (older launchers roll it back).
[[rename]]
match = 'CrabCraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-windows-x64\.zip'
to = '{id}-{version}-windows-x64-portable.zip'

# The tarball holds CrabCraft-<version>/crabcraft.
[[rename]]
match = 'CrabCraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-linux-x86_64\.tar\.gz'
to = '{id}-{version}-linux-x86_64.tar.gz'
