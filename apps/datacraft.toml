# Unofficial bridge: mirrors javy-fernandez/datacraft releases for Craft Unofficial Launcher.
# Run by sync.yml with this repo's bridge.py (the README explains every key).

[bridge]
upstream = "javy-fernandez/datacraft"
repo = "YalKouassi/craft-bridges"
shared = true
# Upstream publishes no checksum file; downloads are checked against GitHub's own digests.

[descriptor]
id = "datacraft"
name = "DataCraft"
tagline = "Database client for SQL databases, in the style of DataGrip"
publisher = "Javy Fernández"
bundle_id = "app.datacraft"               # CFBundleIdentifier in upstream's scripts/bundle.sh
website = "https://github.com/javy-fernandez/datacraft"
color = "#3b6fd4"

[icon]
url = "https://raw.githubusercontent.com/{upstream}/{tag}/assets/icon.png"

# The zips hold DataCraft/DataCraft.exe, one wrapper folder the launcher accepts as it is. The exe
# has no version resource, so it installs from launcher 0.12 on (older launchers roll it back).
[[rename]]
match = 'DataCraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-windows-(?P<arch>x64|arm64)\.zip'
to = '{id}-{version}-windows-{arch}-portable.zip'

# The tarballs hold DataCraft/datacraft.
[[rename]]
match = 'DataCraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-linux-(?P<arch>x64|arm64)\.tar\.gz'
to = '{id}-{version}-linux-{arch}.tar.gz'
map = { arch = { x64 = "x86_64", arm64 = "aarch64" } }

[[rename]]
match = 'DataCraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-universal\.dmg'
to = '{id}-{version}-macos-universal.dmg'
