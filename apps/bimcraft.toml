# Unofficial bridge: mirrors IPedrax/BIMCraft releases for Craft Unofficial Launcher.
# Run by sync.yml with this repo's bridge.py (the README explains every key).

[bridge]
upstream = "IPedrax/BIMCraft"
repo = "YalKouassi/craft-bridges"
shared = true
upstream_sums = ["SHA256SUMS"]
# Not mirrored: the portable zip (its bimcraft.exe carries no version resource, which the launcher
# needs to confirm a portable install, so Windows gets the MSI), AppImage delta files, the macOS
# CLI zip, and the riscv64 builds.
skip = ['-portable\.zip$', '\.zsync$', '^bimcraft-cli-', '-riscv64\.']

[descriptor]
id = "bimcraft"
name = "BIMCraft"
tagline = "Building information modeling: a clean-room take on the Revit workflow"
publisher = "IPedrax"
bundle_id = "io.github.ipedrax.bimcraft"   # upstream's Flatpak, desktop-file and AppStream id
msi_publisher = "IPedrax"                  # Manufacturer in upstream's MSI (packaging/windows/bimcraft.wxs)
website = "https://github.com/IPedrax/BIMCraft"
color = "#2a9d7c"

[icon]
url = "https://raw.githubusercontent.com/{upstream}/{tag}/assets/app-icon/bimcraft-256.png"

# Upstream already names its packages the launcher's way.
[[rename]]
match = 'bimcraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-windows-x64\.msi'
to = '{id}-{version}-windows-x64.msi'

[[rename]]
match = 'bimcraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-macos-universal\.dmg'
to = '{id}-{version}-macos-universal.dmg'

[[rename]]
match = 'bimcraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-linux-(?P<arch>x86_64|aarch64)(?P<ext>\.tar\.gz|\.AppImage|\.deb|\.rpm|\.flatpak|\.pkg\.tar\.zst)'
to = '{id}-{version}-linux-{arch}{ext}'
