# Unofficial bridge: mirrors AlienTechSoftware/notecraft releases for Craft Unofficial Launcher.
# Run by https://github.com/YalKouassi/craft-bridge (its README explains every key).

[bridge]
upstream = "AlienTechSoftware/notecraft"
repo = "YalKouassi/notecraft-for-unofficial-launcher"
# Used whenever a release attaches it (v0.0.7 doesn't). GitHub's asset digests are always checked.
upstream_sums = ["SHA256SUMS.txt"]
skip = ['\.jfif$', '\.gif$', '\.zsync$']

[descriptor]
id = "notecraft"
name = "NoteCraft"
tagline = "Note taking and organization: a clean-room OneNote reimplementation in pure Rust"
publisher = "AlienTech Software"
bundle_id = "com.alientechsoftware.notecraft"   # upstream's desktop-file and icon id
msi_publisher = "AlienTech Software"             # Manufacturer in upstream's MSI
website = "https://github.com/AlienTechSoftware/notecraft"
web_demo = "https://playground.daijro.dev/head/notecraft/"   # playground.daijro.dev's build of upstream's latest commit
color = "#874aca"

[icon]
url = "https://raw.githubusercontent.com/{upstream}/{tag}/assets/brand/notecraft-256.png"

# Upstream already names its packages by the contract. Its portable zip (v0.0.7) is written with
# `\` separators, which the launcher refuses as unsafe, so repack = "auto" rewrites that zip with
# `/` separators and notecraft.exe at the root (same files, same bytes); the rest are unchanged.
[[rename]]
match = 'notecraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-(?P<target>(?:windows|linux|macos|freebsd)-[a-z0-9_]+)(?P<ext>-portable\.zip|\.tar\.gz|\.msi|\.dmg|\.AppImage|\.deb|\.rpm|\.flatpak)'
to = '{id}-{version}-{target}{ext}'
