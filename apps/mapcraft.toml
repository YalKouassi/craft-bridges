# Unofficial bridge: mirrors bearlikelion/MapCraft releases for Craft Unofficial Launcher.
# Run by sync.yml with this repo's bridge.py (the README explains every key).

[bridge]
upstream = "bearlikelion/MapCraft"
repo = "YalKouassi/craft-bridges"
shared = true
# Upstream publishes no checksum file; downloads are checked against GitHub's own digests.
# Not mirrored: the Godot addon, and the macOS build, a zipped .app the launcher can't install.
skip = ['-godot-addon\.zip$', '-macos\.zip$']

[descriptor]
id = "mapcraft"
name = "MapCraft"
tagline = "Level editor for brush-based game maps, in the style of Hammer and TrenchBroom"
publisher = "Mark Arneman"
bundle_id = "io.github.bearlikelion.mapcraft"
website = "https://mapcraft.site"
color = "#e8772e"

[icon]
url = "https://raw.githubusercontent.com/{upstream}/{tag}/apps/mapcraft/assets/mapcraft-256.png"

# Upstream's asset names carry no version: {version} comes from the tag.
# The zip holds MapCraft/MapCraft.exe, one wrapper folder the launcher accepts as it is. The exe has
# no version resource, so it installs from launcher 0.12 on (older launchers roll it back).
[[rename]]
match = 'MapCraft-windows-x86_64\.zip'
to = '{id}-{version}-windows-x64-portable.zip'

[[rename]]
match = 'MapCraft-x86_64\.AppImage'
to = '{id}-{version}-linux-x86_64.AppImage'
