# Unofficial bridge: mirrors Azurehawke/plancraft releases for Craft Unofficial Launcher.
# Run by sync.yml with this repo's bridge.py (the README explains every key).

[bridge]
upstream = "Azurehawke/plancraft"
repo = "YalKouassi/craft-bridges"
shared = true
# Not mirrored: the MSI. It installs into Program Files\ArtCraft\PlanCraft, a folder the launcher
# doesn't look in for the exe, so Windows gets the portable zip (its plancraft.exe carries the
# release's version). Upstream publishes no checksum file; downloads are checked against GitHub's
# own digests.
skip = ['\.msi$']

[descriptor]
id = "plancraft"
name = "PlanCraft"
tagline = "Project planner: schedules, Gantt charts, resources and agile backlogs"
publisher = "Azurehawke"
# Upstream still uses GridCraft's ai.storyteller.* id, which is reserved for ArtCraft's own apps.
# The bridge ships Windows builds only, where the launcher finds the app by its exe, not this id.
bundle_id = "io.github.azurehawke.plancraft"
website = "https://github.com/Azurehawke/plancraft"
color = "#2f6fe0"

[icon]
url = "https://raw.githubusercontent.com/{upstream}/{tag}/assets/app-icon/hicolor/256x256/apps/ai.storyteller.plancraft.png"

# Upstream's zip already has the launcher's name and holds plancraft-<version>-windows-x64-portable/plancraft.exe.
[[rename]]
match = 'plancraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-windows-x64-portable\.zip'
to = '{id}-{version}-windows-x64-portable.zip'
