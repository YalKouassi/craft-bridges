# Unofficial bridge: mirrors bherbruck/solvecraft (SolidCraft) releases for Craft Unofficial Launcher.
# Run by https://github.com/YalKouassi/craft-bridges with craft-bridge's bridge.py
# (https://github.com/YalKouassi/craft-bridge; its README explains every key).

[bridge]
upstream = "bherbruck/solvecraft"
repo = "YalKouassi/solidcraft-for-unofficial-launcher"
# Every download is checked against upstream's own checksum file; a mismatch aborts the run.
upstream_sums = ["SHA256SUMS.txt"]
# Not mirrored: AppImage delta files, snaps (the launcher doesn't install them), the unversioned
# copies of each package, the Windows Setup.exe, and the CLI-only and web builds.
skip = [
  '\.zsync$',
  '\.snap$',
  '^solidcraft-(?:windows|linux|macos|freebsd)-',
  '^SolidCraft-.*\.exe$',
  '^solidcraft-cli-',
  '^solidcraft-web-',
]

[descriptor]
id = "solidcraft"
name = "SolidCraft"
tagline = "Parametric 3D CAD in pure Rust, with an MCP server for automation"
publisher = "SolidCraft contributors"
bundle_id = "io.tangencylabs.solidcraft"        # upstream's desktop-file and AppStream id
msi_publisher = "SolidCraft contributors"       # Manufacturer in upstream's MSI
website = "https://solidcraft.io"
web_demo = "https://playground.daijro.dev/solidcraft/"
color = "#ff7a1f"                                # the accent playground.daijro.dev uses for it

[icon]
url = "https://raw.githubusercontent.com/{upstream}/{tag}/assets/icons/app/linux/exports/hicolor/256x256/apps/io.tangencylabs.solidcraft.png"

# Upstream already names its packages by the contract: they are mirrored unchanged.
[[rename]]
match = 'solidcraft-(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)-(?P<target>(?:windows|linux|macos|freebsd)-[a-z0-9_]+)(?P<ext>-portable\.zip|\.tar\.gz|\.msi|\.dmg|\.AppImage|\.deb|\.rpm|\.pkg\.tar\.zst|\.flatpak)'
to = '{id}-{version}-{target}{ext}'
